name: 금융 뉴스 수집
on:
  workflow_dispatch:
  schedule:
    # 매일 아침 KST 07:30 도착 목표.
    #   GitHub cron은 정시를 보장하지 않는다 — 실측 지연이 +54~57분으로
    #   반복됐다(정각·30분은 전 세계 요청이 몰리는 슬롯이라 밀린다).
    #   그래서 ① 어중간한 분(:47)으로 붐빔을 피하고
    #        ② 목표보다 40분 이르게 걸어 지연을 흡수한다.
    #   UTC 21:47 = KST 06:47 → 지연 40~50분이면 07:30 전후 도착.
    - cron: "47 21 * * *"
    # 위가 누락될 경우를 대비한 백업 (KST 08:13).
    #   같은 회차 안에서 증분 수집이 이미 처리했으면 새 기사가 없어 곧 끝난다.
    - cron: "13 23 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 실행 트리거 표시
        run: echo "트리거=${{ github.event_name }} · 예정시각=${{ github.event.schedule || '수동' }} · 현재 $(TZ=Asia/Seoul date '+%m-%d %H:%M') KST"
      - name: 뉴스 수집 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TZ: Asia/Seoul
        run: python -u main.py
      - name: 목록 보기 갱신 (article_list.html)
        if: always()
        run: python list_view.py
      - name: DB 커밋
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f news.db output/financial_news_archive.html output/article_list.html
          git diff --staged --quiet || git commit -m "run"
          # 실행 도중 다른 push가 들어오면 원격이 앞서가 push가 거부된다.
          #   rebase로 원격 변경을 먼저 얹고, 실패하면 재시도.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "push 재시도 $i"
            sleep 5
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output
  deploy:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
