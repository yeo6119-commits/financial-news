name: 금융 뉴스 수집
on:
  workflow_dispatch:
  schedule:
    # 매일 아침 7:30 KST (UTC 22:30 전날)
    - cron: "30 22 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: 뉴스 수집 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TZ: Asia/Seoul
        run: python main.py
      - name: 목록 보기 갱신 (article_list.html)
        run: python list_view.py
      - name: DB 커밋
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f news.db output/financial_news_archive.html output/article_list.html
          git diff --staged --quiet || git commit -m "run"
          # 실행 도중 다른 push가 들어오면 원격이 앞서가 push가 거부된다.
          #   rebase로 원격 변경을 먼저 얹고, 실패하면 재시도.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "push 재시도 $i"
            sleep 5
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
