name: 금융 뉴스 수집
on:
  workflow_dispatch:
  schedule:
    # 매일 아침 KST 07:30 도착 목표.
    #   GitHub cron은 정시를 보장하지 않는다 — 실측 지연이 +54~57분으로
    #   반복됐다(정각·30분은 전 세계 요청이 몰리는 슬롯이라 밀린다).
    #   그래서 ① 어중간한 분(:47)으로 붐빔을 피하고
    #        ② 목표보다 40분 이르게 걸어 지연을 흡수한다.
    #   UTC 21:47 = KST 06:47 → 지연 40~50분이면 07:30 전후 도착.
    - cron: "47 21 * * *"
    # 위가 누락될 경우를 대비한 백업 (KST 08:13).
    #   같은 회차 안에서 증분 수집이 이미 처리했으면 새 기사가 없어 곧 끝난다.
    - cron: "13 23 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: financial-news-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # ref를 명시하지 않으면 checkout은 '실행이 만들어진 시점'의 커밋(github.sha)을 받는다.
      #   concurrency로 대기하던 실행은 앞 실행이 끝난 뒤에 시작해도 구버전을 받아,
      #   앞 실행의 news.db·HTML 위에서 다시 만든 결과가 rebase 충돌을 일으키고
      #   충돌 표시(<<<<<<<)가 든 HTML이 Pages에 배포됐다 (2026-10-07).
      #   항상 '지금' main 끝을 받는다.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Claude Code CLI 설치 (구독 토큰이 있을 때만 — Groq 소진 시 요약 대체용)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        continue-on-error: true
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            npm install -g @anthropic-ai/claude-code && claude --version
          else
            echo "CLAUDE_CODE_OAUTH_TOKEN 없음 — 설치 생략"
          fi
      - name: 실행 트리거 표시
        run: echo "트리거=${{ github.event_name }} · 예정시각=${{ github.event.schedule || '수동' }} · 현재 $(TZ=Asia/Seoul date '+%m-%d %H:%M') KST"
      - name: 뉴스 수집 실행
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TZ: Asia/Seoul
        run: python -u main.py
      - name: 목록 보기 갱신 (article_list.html)
        if: always()
        run: python list_view.py
      - name: 무제한 아카이브 갱신 (archive/*.csv, 삭제 없음)
        run: python archive.py
      - name: DB 커밋
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f news.db output/financial_news_archive.html output/article_list.html
          git add archive
          git diff --staged --quiet || git commit -m "run"
          # 실행 도중 다른 push가 들어오면 원격이 앞서가 push가 거부된다.
          #   rebase로 원격 변경을 먼저 얹고, 실패하면 재시도.
          #   충돌로 rebase가 중간에 멈추면 작업 트리에 충돌 표시가 남아 그대로 배포되므로
          #   반드시 abort로 원상 복구한다. 끝내 push 못 하면 단계를 실패시켜 눈에 띄게 한다
          #   (예전엔 마지막 명령이 sleep이라 실패해도 초록불이었다).
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main; then
              git push && { pushed=1; break; }
            else
              echo "::warning::rebase 충돌 — 중단하고 원상 복구"
              git rebase --abort || true
            fi
            echo "push 재시도 $i"
            sleep 5
          done
          if [ "$pushed" != 1 ]; then
            echo "::error::push 실패 — 이번 회차 DB가 저장소에 반영되지 않았습니다"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: output
  deploy:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
