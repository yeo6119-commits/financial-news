name: 해외 영문 뉴스
# 국내 파이프라인(run.yml)과 완전히 분리된 별도 트랙이다.
#   - 별도 concurrency 그룹: 같은 그룹이면 대기 중인 국내 실행이 이쪽에 밀려 취소될 수 있다.
#   - 커밋 대상이 겹치지 않는다: foreign/data/*.json, output/foreign.html (국내는 news.db·국내 HTML)
#   - 요약은 구독 Claude(CLAUDE_CODE_OAUTH_TOKEN)만 쓴다. Groq·네이버를 쓰지 않아 국내 한도에 영향이 없다.
on:
  workflow_dispatch:
  schedule:
    # 국내(KST 06:47·08:13)와 시간을 겹치지 않게 하고, 미국 장 마감·아침 기사를 하루 3번 받는다.
    #   어중간한 분으로 붐빔 슬롯(정각·30분)을 피한다.
    - cron: "23 3 * * *"    # KST 12:23
    - cron: "17 9 * * *"    # KST 18:17
    - cron: "41 14 * * *"   # KST 23:41
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: foreign-news-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 항상 지금 main 끝을 받는다(대기하던 실행이 구버전 위에서 도는 문제 방지 — run.yml과 같은 이유)
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Claude Code CLI 설치 (구독 요약용)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        continue-on-error: true
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            npm install -g @anthropic-ai/claude-code && claude --version
          else
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN 없음 — 해외 기사는 요약할 수 없어 수집을 건너뜁니다"
          fi
      - name: 해외 영문 뉴스 수집 · 페이지 생성
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TZ: Asia/Seoul
        run: python -u foreign.py
      - name: 커밋
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          [ -d foreign/data ] && git add -f foreign/data || true     # 첫 실행에서 요약 불가면 디렉터리가 없다
          git add -f output/foreign.html
          git diff --staged --quiet || git commit -m "foreign"
          # 국내 실행과 같은 방식: rebase 충돌은 원상 복구, 끝내 push 못 하면 단계를 실패시킨다
          pushed=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main; then
              git push && { pushed=1; break; }
            else
              echo "::warning::rebase 충돌 — 중단하고 원상 복구"
              git rebase --abort || true
            fi
            echo "push 재시도 $i"
            sleep 5
          done
          if [ "$pushed" != 1 ]; then
            echo "::error::push 실패 — 이번 회차 해외 기사가 저장소에 반영되지 않았습니다"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: output
  deploy:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
